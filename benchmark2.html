<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, className = "w-5 h-5", color = "currentColor" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (ref.current) {
                    lucide.createIcons({
                        icons: {
                            [name]: lucide.icons ? lucide.icons[name] : undefined // fallback if necessary, but actually we just pass name
                        },
                        nameAttr: 'data-lucide',
                        attrs: {
                            class: className,
                            style: `color: ${color}`
                        },
                        root: ref.current.parentElement
                    });
                }
            }, [name, className, color]);
            return <span ref={ref}><i data-lucide={name} className={className} style={{ color }}></i></span>;
        };

        const App = () => {
            const [renderTime, setRenderTime] = useState(null);

            const icons = Array.from({ length: 500 }).map((_, i) => (
                <Icon key={i} name="shield" />
            ));

            return <div>{icons}</div>;
        };

        const start = performance.now();
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        setTimeout(() => {
            const end = performance.now();
            console.log(`Total time: ${end - start}ms`);
        }, 1500);
    </script>
</body>
</html>
